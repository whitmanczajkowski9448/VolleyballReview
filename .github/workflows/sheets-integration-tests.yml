name: VolleyReview Sheets Integration Checks

on:
  pull_request:
    paths:
      - 'integrations/google_sheets/**'
      - '.github/workflows/sheets-integration-tests.yml'
  push:
    branches:
      - feature/master-google-sheets-play-library
    paths:
      - 'integrations/google_sheets/**'
      - '.github/workflows/sheets-integration-tests.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r integrations/google_sheets/backend/requirements.txt
      - run: python -m unittest discover -s integrations/google_sheets/tests -v
      - run: python -m compileall -q integrations/google_sheets/backend
      - name: Check both Apps Script files
        run: |
          cp integrations/google_sheets/google_apps_script/Code.gs /tmp/volleyreview-code.js
          cp integrations/google_sheets/google_apps_script/Finder.gs /tmp/volleyreview-finder.js
          node --check /tmp/volleyreview-code.js
          node --check /tmp/volleyreview-finder.js
