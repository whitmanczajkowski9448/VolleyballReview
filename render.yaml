# VolleyReview play-library API deployment blueprint.
# This creates a separate API service; it does NOT replace the existing Streamlit app.
# Secrets are prompted for in Render or generated by Render and must never be committed.
services:
  - type: web
    name: volleyreview-play-library-api
    runtime: docker
    branch: master
    dockerfilePath: integrations/google_sheets/backend/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: SUPABASE_URL
        value: https://hrthyllrclxfiwwiwngv.supabase.co
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SHEETS_INTEGRATION_KEY
        sync: false
      - key: DOWNLOAD_SIGNING_SECRET
        generateValue: true
      - key: PUBLIC_BASE_URL
        sync: false
      - key: ALLOWED_MEDIA_HOSTS
        value: dvsportreplay.blob.core.windows.net
      - key: DVSPORT_COOKIE
        sync: false
      - key: DOWNLOAD_LINK_TTL_DAYS
        value: "7"
      - key: MAX_ZIP_TOTAL_MB
        value: "1500"
